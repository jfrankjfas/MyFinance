name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        cache-disabled: true
        validate-wrappers: false

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew || true

    - name: Restore Debug Keystore
      run: |
        if [ -f debug.keystore.base64 ]; then
          base64 -d debug.keystore.base64 > debug.keystore
        fi

    - name: Build Debug APK
      run: ./gradlew :app:assembleDebug || gradle :app:assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Create or Update GitHub Release for In-App Updates
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: app/build/outputs/apk/debug/app-debug.apk
        tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.1' }}
        name: "Finanzas Clara ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.1' }}"
        body: |
          🚀 **Compilación automática generada por GitHub Actions**
          
          ### 📱 Actualización de la App:
          - Sincronización en vivo con Firestore y Google Identity Services
          - Plan de rescate y triaje financiero interactivo
          - Actualizador automático dentro de la aplicación (In-App Auto-Update)
          
          El archivo `app-debug.apk` se descarga e instala automáticamente desde la aplicación.
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

