name: Deploy to Google Play / Firebase Distribution

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  distribute:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        cache-disabled: true

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew || true

    - name: Restore Keystore
      run: |
        if [ -f debug.keystore.base64 ]; then
          base64 -d debug.keystore.base64 > debug.keystore
        fi

    - name: Build Android App Bundle (AAB for Google Play)
      run: ./gradlew :app:bundleRelease || gradle :app:bundleRelease

    - name: Build Release APK
      run: ./gradlew :app:assembleRelease || gradle :app:assembleRelease

    - name: Upload AAB Bundle Artifact
      uses: actions/upload-artifact@v4
      with:
        name: finanzas-clara-release-aab
        path: app/build/outputs/bundle/release/*.aab

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: finanzas-clara-release-apk
        path: app/build/outputs/apk/release/*.apk

    # Paso opcional para publicar automáticamente en Google Play Console:
